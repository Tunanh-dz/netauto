<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetAuto - Đăng nhập</title>
<style>
  :root { --bg: #e9edf1; --card: #ffffff; --ink: #1f2933; --muted: #5f6c7b; --line: #d5dce3; --accent: #1a6fb5; --bad: #b42318; --bad-bg: #fde7e4; --head: #1f3347; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --card: #1a2129; --ink: #e6ebf0; --muted: #98a6b5; --line: #2b3541; --accent: #6ea1ff; --bad: #ff7b72; --bad-bg: #3d1a17; --head: #0b1016; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .box { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .head { background: var(--head); color: #fff; padding: 18px 22px; }
  .head h1 { margin: 0; font-size: 18px; } .head p { margin: 2px 0 0; font-size: 13px; opacity: .75; }
  form { padding: 22px; display: grid; gap: 14px; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: 13px; color: var(--muted); }
  input { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 20px; font-size: 14px; }
  .msg.bad { color: var(--bad); background: var(--bad-bg); padding: 8px 10px; border-radius: 8px; }
  .hint { font-size: 13px; color: var(--muted); padding: 0 22px 20px; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="box">
  <div class="head"><h1>NetAuto</h1><p>Đăng nhập để xem và vận hành mạng</p></div>
  <form id="lg-form" autocomplete="on">
    <label>Tên đăng nhập <input id="lg-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
    <label>Mật khẩu <input id="lg-pass" name="password" type="password" autocomplete="current-password" required></label>
    <button id="lg-submit" type="submit">Đăng nhập</button>
    <div id="lg-msg" class="msg" role="alert"></div>
  </form>
  <div id="lg-hint" class="hint" hidden>Chưa có tài khoản nào. Tạo tài khoản quản trị đầu tiên trên máy chạy hệ thống:<br><code>python3 -m netauto.users add &lt;tên&gt; --role admin</code></div>
</div>
<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };
fetch("/api/login-info").then(function (r) { return r.json(); }).then(function (d) {
  if (d && d.has_users === false) $("lg-hint").hidden = false;
}).catch(function () { /* không có thông tin thì thôi */ });
$("lg-form").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var msg = $("lg-msg"), btn = $("lg-submit");
  msg.className = "msg"; msg.textContent = ""; btn.disabled = true;
  fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
                       body: JSON.stringify({username: $("lg-user").value, password: $("lg-pass").value})})
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.detail ? String(d.detail) : "Lỗi " + r.status);
        location.reload();
      });
    })
    .catch(function (e) { msg.className = "msg bad"; msg.textContent = e.message; $("lg-pass").value = ""; btn.disabled = false; });
});
</script>
</body>
</html>
