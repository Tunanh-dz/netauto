# Trạng thái MONG MUỐN của mạng (intent). Đây là nguồn sự thật.
version: 1

vlans:
  10: {name: Sales,       subnet: 192.168.10.0/24, gateway: 192.168.10.1, router: r1}
  20: {name: Engineering, subnet: 192.168.20.0/24, gateway: 192.168.20.1, router: r2}
  30: {name: Guest,       subnet: 192.168.30.0/24, gateway: 192.168.30.1, router: r1}
  99: {name: Management,  subnet: 192.168.99.0/24, gateway: 192.168.99.1, router: r2}

routers:
  r1:
    trunk_port: eth1
    uplink: {port: eth2, ip: 10.0.12.1/30}
    ospf: {router_id: "1.1.1.1", neighbors: ["2.2.2.2"]}
  r2:
    trunk_port: eth1
    uplink: {port: eth2, ip: 10.0.12.2/30}
    ospf: {router_id: "2.2.2.2", neighbors: ["1.1.1.1"]}

switches:
  sw1:
    trunk: {port: eth1, vlans: [10, 30]}
    access: {eth2: 10, eth3: 30}
  sw2:
    trunk: {port: eth1, vlans: [20, 99]}
    access: {eth2: 20, eth3: 99}

hosts:
  h-sales: {vlan: 10, ip: 192.168.10.10/24}
  h-guest: {vlan: 30, ip: 192.168.30.10/24}
  h-eng:   {vlan: 20, ip: 192.168.20.10/24}
  h-mgmt:  {vlan: 99, ip: 192.168.99.10/24}

monitoring:
  # Cổng quản lý do Docker cấp IP, không thuộc intent: bỏ qua khi so snapshot
  ignore_interfaces: [eth0]

probes:
  - {src: h-sales, dst: h-eng}     # đi qua liên kết r1-r2 (OSPF)
  - {src: h-guest, dst: h-mgmt}    # đi qua liên kết r1-r2 (OSPF)
  - {src: h-sales, dst: h-guest}   # cùng r1, định tuyến giữa VLAN
  - {src: h-eng,   dst: h-mgmt}    # cùng r2, định tuyến giữa VLAN